name: Feature request
description: Suggest a change or an addition.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like, and why?
    validations: {required: true}
  - type: textarea
    id: reference
    attributes:
      label: Reference
      description: A Material 3 / Android behaviour or a spec link this should follow, if any.

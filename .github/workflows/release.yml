name: Release

# A tag vX.Y.Z (or vX.Y.Z-suffix) runs the full test suite, builds the packages and publishes a GitHub release.
# "Run workflow" (workflow_dispatch) builds everything for the given version but publishes nothing.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (dry run: nothing is published)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    name: Version and release notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Work out the version
        id: v
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$EVENT" == push ]]; then version="${REF_NAME#v}"; else version="$INPUT_VERSION"; fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::bad version '$version'"; exit 1; }
          # Pre-release: below 1.0.0, or any suffix.
          if [[ "$version" == 0.* || "$version" == *-* ]]; then prerelease=true; else prerelease=false; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - name: The tag must point at a commit of main
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::tag is not on main"; exit 1; }
      - name: Versions in the sources match
        run: scripts/release.sh --ci "${{ steps.v.outputs.version }}"
      - name: The CHANGELOG has a section for this version
        run: scripts/release-notes.sh "${{ steps.v.outputs.version }}"

  ci:
    name: Tests
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build packages
    needs: [meta, ci]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-shell gettext unzip
      - name: Zips for extensions.gnome.org
        run: |
          scripts/pack.sh --out dist
          python3 tests/check_packs.py dist
      - name: Debian package
        run: scripts/build-deb.sh "$VERSION" --out dist
      - name: Source tarball
        run: git archive --format=tar.gz --prefix="m3e-gnome-extensions-$VERSION/" -o "dist/m3e-gnome-extensions-$VERSION.tar.gz" HEAD
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Release notes
        run: |
          { scripts/release-notes.sh "$VERSION"; echo; sed "s/VERSION/${VERSION/-/\~}/g" .github/release-footer.md; } > release-notes.md
          cat release-notes.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: |
            dist/*
            release-notes.md
          if-no-files-found: error

  publish:
    name: Publish the GitHub release
    needs: [meta, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      id-token: write      # sign the build provenance attestation
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
      PRERELEASE: ${{ needs.meta.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.deb
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS
      - name: Create the release
        run: |
          flags=()
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$TAG" --notes-file release-notes.md "${flags[@]}"

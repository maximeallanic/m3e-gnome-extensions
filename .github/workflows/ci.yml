name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:   # reused by the release workflow

permissions:
  contents: read

jobs:
  lint:
    name: ESLint (GJS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint .

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck on every shell script
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -x

  test:
    name: Unit tests and static checks
    runs-on: ubuntu-latest
    # The extensions target GNOME Shell 50: Ubuntu 24.04's gjs and mutter are too old for the tests.
    container: debian:testing
    steps:
      - name: Install GJS, the mutter typelibs and gettext
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git gjs gir1.2-girepository-3.0 \
              gir1.2-mutter-18 gnome-shell gettext python3
      - uses: actions/checkout@v4
      - name: Generated files are up to date
        run: python3 tools/generate.py --check
      - name: Embedded toolkit copies are up to date
        run: |
          scripts/build.sh
          scripts/build.sh --check
      - name: Run the headless tests
        run: tests/run.sh

  pack:
    name: Pack for extensions.gnome.org
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gnome-extensions and gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-shell gettext unzip
      - run: scripts/pack.sh
      - name: Check the zip files
        run: python3 tests/check_packs.py dist
      - uses: actions/upload-artifact@v7
        with:
          name: extension-zips
          path: dist/*.zip

  deb:
    name: Debian package and lintian
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install lintian
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lintian gettext
      - run: scripts/build-deb.sh 0.0.0-ci --out dist
      - name: Lint the package
        run: lintian --info --display-info --fail-on error dist/*.deb

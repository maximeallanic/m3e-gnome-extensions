name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: ESLint (GJS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint .

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck on every shell script
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -x

  test:
    name: Unit tests and static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GJS and gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gjs gettext python3
      - name: Generated files are up to date
        run: python3 tools/generate.py --check
      - name: Embedded toolkit copies are up to date
        run: |
          scripts/build.sh
          scripts/build.sh --check
      - name: Run the headless tests
        run: tests/run.sh

  pack:
    name: Pack for extensions.gnome.org
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gnome-extensions and gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-shell gettext unzip
      - run: scripts/pack.sh
      - name: Check the zip files
        run: python3 tests/check_packs.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zips
          path: dist/*.zip
